<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sulgpalliklubi</title>
</head>
<body>

<header>
    <h1>Sulgpalliklubi</h1>

    <nav>
        <a href="#">Avaleht</a>
        <a href="#">Mangukorrad</a>
        <a href="#">Kontakt</a>
    </nav>
</header>

<main>

    <h2>Tulevased mangukorrad</h2>

    <table border="1">
        <tr>
            <th>Kuupaev</th>
            <th>Algus</th>
            <th>Valjakuid</th>
            <th>Vabu kohti</th>
        </tr>
        <tr>
            <td>10.09.2026</td>
            <td>18:00</td>
            <td>4</td>
            <td>8</td>
        </tr>
        <tr>
            <td>12.09.2026</td>
            <td>19:00</td>
            <td>6</td>
            <td>12</td>
        </tr>
        <tr>
            <td>15.09.2026</td>
            <td>20:00</td>
            <td>5</td>
            <td>3</td>
        </tr>
    </table>

    <h2>Otsing</h2>

    <form method="get">

        <fieldset>
            <legend>Mangu otsing</legend>

            <p>
                <label for="alates">Kuupaev:</label>
                <input type="date" id="alates" name="alates">
            </p>

            <p>
                <label for="vabu">Vabu kohti:</label>
                <input type="number" id="vabu" name="vabu" min="1" max="24">
            </p>

            <p>
                <label for="sort">Sorteerimine:</label>
                <select id="sort" name="sort">
                    <option value="kuupaev">Kuupaev</option>
                    <option value="vabad">Vabad kohad</option>
                </select>
            </p>

            <p>
                <input type="checkbox" id="ainultVabad" name="ainultVabad" value="1">
                <label for="ainultVabad">Ainult vabad mangud</label>
            </p>

            <p>
                <label for="epost">E-post:</label>
                <input type="email" id="epost" name="epost">
            </p>

            <button type="submit">Otsi</button>

        </fieldset>

    </form>

</main>

<footer>
    <p>Sulgpalliklubi 2026</p>
</footer>

</body>
</html>
